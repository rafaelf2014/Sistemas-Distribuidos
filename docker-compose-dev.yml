services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: one_health
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Backend services ───────────────────────────────────────────────────────

  servico_analise:
    build:
      context: .
      dockerfile: ServicoAnalise.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres/one_health
    ports:
      - "50052:50052"
    depends_on:
      - postgres
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Server.Dockerfile
    environment:
      DB_CONNECTION_STRING: Host=postgres;Database=one_health;Username=postgres;Password=postgres
      ANALISE_URL: http://servico_analise:50052
    ports:
      - "8080:8080"
      - "14000:14000"
      - "14001:14001"
    depends_on:
      - postgres
      - servico_analise
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Frontend.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  # ── Gateway_001 + PreProcessamento ─────────────────────────────────────────

  preprocessamento:
    build:
      context: .
      dockerfile: PreProcessamento.Dockerfile
    restart: unless-stopped

  gateway_001:
    build:
      context: .
      dockerfile: Gateway.Dockerfile
      args:
        GATEWAY_DIR: Gateway_001
    environment:
      RABBITMQ_HOST: rabbitmq
      SERVER_IP: server
      PREPROCESSAMENTO_GRPC_URL: http://preprocessamento:50051
      ANALISE_GRPC_URL: http://servico_analise:50052
    depends_on:
      - rabbitmq
      - server
      - preprocessamento
    restart: unless-stopped

  # ── Sensors 001–004 ────────────────────────────────────────────────────────

  sensor_001:
    build:
      context: .
      dockerfile: Sensor.Dockerfile
      args:
        SENSOR_DIR: Sensor_001
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
    restart: unless-stopped

  sensor_002:
    build:
      context: .
      dockerfile: Sensor.Dockerfile
      args:
        SENSOR_DIR: Sensor_002
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
    restart: unless-stopped

  sensor_003:
    build:
      context: .
      dockerfile: Sensor.Dockerfile
      args:
        SENSOR_DIR: Sensor_003
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
    restart: unless-stopped

  sensor_004:
    build:
      context: .
      dockerfile: Sensor.Dockerfile
      args:
        SENSOR_DIR: Sensor_004
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:

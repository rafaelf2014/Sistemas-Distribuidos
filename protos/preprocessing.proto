syntax = "proto3";

option csharp_namespace = "PreProcessamento";

package preprocessing;

// Invocado pelo Gateway antes de escrever para o buffer CSV.
// Recebe uma leitura bruta do sensor e devolve o valor normalizado e validado.
service PreProcessamentoService {
  rpc Normalizar      (LeituraBruta)        returns (LeituraProcessada);
  rpc NormalizarBloco (BlocoLeiturasBrutas) returns (BlocoLeiturasProcessadas);
}

message BlocoLeiturasBrutas {
  repeated LeituraBruta dados = 1;
}

message BlocoLeiturasProcessadas {
  repeated LeituraProcessada dados = 1;
}

message LeituraBruta {
  string gateway_id = 1;
  string sensor_id  = 2;
  string zona       = 3;
  string tipo       = 4;  // TEMP, HUM, CO2, RUIDO, LUMIN, PART, ...
  double valor      = 5;
  string unidade    = 6;  // unidade enviada pelo sensor (ex: "F", "C", "ppm")
  string timestamp  = 7;
}

message LeituraProcessada {
  string gateway_id        = 1;
  string sensor_id         = 2;
  string zona              = 3;
  string tipo              = 4;
  double valor_normalizado = 5;
  string unidade_padrao    = 6;  // unidade canónica após normalização
  string timestamp         = 7;
  bool   valido            = 8;  // false = fora de range, descartar
  string observacao        = 9;  // motivo se inválido, info se convertido
}
